plugins {
    id 'com.android.application'
}

import java.util.Properties

Properties properties = new Properties()
File localPropertiesFile = project.rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    properties.load(new FileInputStream(localPropertiesFile))
}
def learnerApiKey = properties.getProperty("MERRIAM_WEBSTER_LEARNER_API_KEY", "")
def thesaurusApiKey = properties.getProperty("MERRIAM_WEBSTER_THESAURUS_API_KEY", "")

android {
    namespace 'com.wordspark.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wordspark.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "MERRIAM_WEBSTER_LEARNER_API_KEY", "\"${learnerApiKey}\""
        buildConfigField "String", "MERRIAM_WEBSTER_THESAURUS_API_KEY", "\"${thesaurusApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
